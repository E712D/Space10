services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: space10
      POSTGRES_USER: space10
      POSTGRES_PASSWORD: space10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space10 -d space10"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://space10:space10@database:5432/space10
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./contracts:/app/contracts

  frontend:
    build:
      context: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata: