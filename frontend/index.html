<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f5d46" />
    <meta
      name="description"
      content="S3A aide les petits producteurs de Côte d'Ivoire à choisir leurs cultures grâce au climat et aux données satellites."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <title>S3A — Assistant agricole</title>
    <style>
      /* Écran de démarrage statique : visible avant le chargement du JavaScript, puis remplacé par l'application. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 32px;
        text-align: center;
        color: #fbfaf5;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(140deg, #2f6a47 0%, #1b4332 100%);
      }
      .boot-splash strong {
        font-size: 48px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .boot-splash span {
        font-size: 16px;
        font-weight: 600;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Ouverture de S3A">
        <strong>S3A</strong>
        <span>Assistant agricole</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
